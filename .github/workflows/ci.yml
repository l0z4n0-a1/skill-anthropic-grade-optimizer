name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.12']
        exclude:
          # The current Ubuntu runner image has no Python 3.9 build; the job
          # below runs 3.9 on Linux in the official python:3.9 container.
          - os: ubuntu-latest
            python: '3.9'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Measurement, gate behavior and knowledge-base structure. Quote checking
      # against the sources needs the snapshots, which are not committed;
      # maintainers run scripts/kb_gate.py locally (see references/maintaining.md).
      - name: Unit tests
        run: python -B -m unittest discover -s tests -t . -v

  linux-py39:
    name: Tests (linux container, Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.9-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unit tests
        run: |
          python --version
          python -B -m unittest discover -s tests -t . -v
