name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Measurement, gate behavior and knowledge-base structure. Quote checking
      # against live documentation needs the snapshots, which are not committed;
      # maintainers run scripts/kb_gate.py locally (see references/maintaining.md).
      - name: Unit tests
        run: python -m unittest discover tests -v
