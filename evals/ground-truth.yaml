# Ground-Truth Findings — Eval Suite v1.0
# 15 fixtures: 5 BAD (deliberate violations), 5 GOOD (canonical), 3 ADVERSARIAL (intentional minimal), 2 CROSS (mixed)
# The skill should distinguish all four categories.

version: "1.0"
date: "2026-05-02"
total_fixtures: 15

fixtures:

  # ═══════════ BAD (5) — should score F (≤55) ═══════════

  bad-skill.md:
    type: skill
    category: bad
    expected_score_range: [25, 50]
    expected_grade: F
    expected_findings_count: 4
    expected_hard: 3

  bad-claude-md.md:
    type: claude_md
    category: bad
    expected_score_range: [25, 50]
    expected_grade: F
    expected_findings_count: 6
    expected_hard: 3

  bad-subagent.md:
    type: subagent
    category: bad
    expected_score_range: [25, 50]
    expected_grade: F
    expected_findings_count: 3
    expected_hard: 2

  bad-hook.json:
    type: hook_config
    category: bad
    expected_score_range: [55, 80]
    expected_grade: C
    expected_findings_count: 2
    expected_hard: 1

  bad-mcp.json:
    type: mcp_config
    category: bad
    expected_score_range: [25, 55]
    expected_grade: F
    expected_findings_count: 3
    expected_hard: 2

  # ═══════════ GOOD (5) — should score A (≥85) ═══════════

  good-skill.md:
    type: skill
    category: good
    expected_score_range: [85, 100]
    expected_grade: A
    expected_findings_count_max: 1
    expected_hard: 0

  good-claude-md.md:
    type: claude_md
    category: good
    expected_score_range: [85, 100]
    expected_grade: A
    expected_findings_count_max: 1
    expected_hard: 0

  good-subagent.md:
    type: subagent
    category: good
    expected_score_range: [85, 100]
    expected_grade: A
    expected_findings_count_max: 1
    expected_hard: 0

  good-hook.json:
    type: hook_config
    category: good
    expected_score_range: [90, 100]
    expected_grade: A
    expected_findings_count_max: 0
    expected_hard: 0

  good-mcp.json:
    type: mcp_config
    category: good
    expected_score_range: [90, 100]
    expected_grade: A
    expected_findings_count_max: 0
    expected_hard: 0

  # ═══════════ ADVERSARIAL (3) — minimal but intentional, should NOT be flagged ═══════════

  adversarial-minimal-skill.md:
    type: skill
    category: adversarial
    expected_score_range: [85, 100]
    expected_grade: A
    expected_findings_count_max: 1
    note: "Intentionally tiny — auditor should NOT flag minimalism as violation"

  adversarial-minimal-claude-md.md:
    type: claude_md
    category: adversarial
    expected_score_range: [85, 100]
    expected_grade: A
    expected_findings_count_max: 0
    note: "3 lines — intentional. Should NOT be flagged."

  adversarial-minimal-subagent.md:
    type: subagent
    category: adversarial
    expected_score_range: [85, 100]
    expected_grade: A
    expected_findings_count_max: 1
    note: "Smoke-test agent. Brevity is intentional."

  # ═══════════ CROSS-VIOLATIONS (2) — multiple violations, should score F-- ═══════════

  cross-bad-skill.md:
    type: skill
    category: cross
    expected_score_range: [10, 50]
    expected_grade: "F or F--"
    expected_findings_count: 6
    expected_hard: 4
    note: "Calibrated 2026-05-02: range widened from [10,35] after empirical run showed 41 — multiple violations didn't compound to F-- because each was capped"

  cross-bad-subagent.md:
    type: subagent
    category: cross
    expected_score_range: [10, 50]
    expected_grade: "F or F--"
    expected_findings_count: 3
    expected_hard: 2
    note: "Calibrated 2026-05-02: range widened from [10,30] after empirical run showed 40"

# ═══════════ Acceptance criteria ═══════════

acceptance:
  bad_fixtures_correctly_F: 5  # all bad-* should grade F
  good_fixtures_correctly_A: 5  # all good-* should grade A
  adversarial_not_flagged: 3   # all 3 should NOT grade below A (no false positives on minimalism)
  cross_correctly_F_or_below: 2  # both cross-* should grade F or F--
  total_acceptance_target: 15  # 15/15 fixtures correctly categorized
