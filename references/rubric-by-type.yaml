# ═══════════════════════════════════════════════════════════════
# False-positive suppression matrix (D9 conflict resolution)
# ═══════════════════════════════════════════════════════════════
false_positive_rules:
  - rule_id: AR-CC-S09  # yellow-flag ALL-CAPS
    suppress_on_types: [claude_md, system_prompt, user_prompt]
    reason: "best-practices.md endorses emphasis on these types (AR-CLAR-015); yellow-flag only applies to skill/subagent body"
  - rule_id: AR-CC-S01  # SKILL.md frontmatter
    suppress_on_types: [claude_md, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow]
    reason: "Frontmatter spec is SKILL.md-specific"
  - rule_id: AR-CC-024  # ≤500 lines body
    suppress_on_types: [claude_md, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow]
    reason: "500-line cap is SKILL.md-specific. CLAUDE.md uses 200-line target (AR-CC-002)."
  # NEW v1.3 — currency-patch suppressions
  - rule_id: AR-CC-S12  # test with multiple models
    suppress_on_types: [claude_md, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow, api_config]
    reason: "Cross-model testing rule is SKILL.md-specific."
  - rule_id: AR-CC-S13  # gerund-form name
    suppress_on_types: [claude_md, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow, api_config]
    reason: "Naming convention is SKILL.md-specific."
  - rule_id: AR-CC-S14  # reserved-word check
    suppress_on_types: [claude_md, hook_config, mcp_config, system_prompt, user_prompt, workflow, api_config]
    reason: "Reserved-word rule applies to skill+subagent name only."
  - rule_id: AR-CC-S17  # solve don't punt
    suppress_on_types: [claude_md, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow, api_config]
    reason: "Script-error-handling rule applies only to skills with executable code."
  - rule_id: AR-CC-S19  # MCP tools fully-qualified
    suppress_on_types: [claude_md, hook_config, mcp_config, system_prompt, user_prompt, workflow, api_config]
    reason: "MCP-tool-reference rule applies to skill/subagent bodies that mention MCP tools."
  - rule_id: AR-CC-S21  # >100 lines TOC
    suppress_on_types: [claude_md, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow, api_config]
    reason: "TOC requirement applies to skill reference files."
  - rule_id: AR-MODEL-021  # prefill migration: structured outputs
    suppress_on_types: [claude_md, skill, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow]
    reason: "Prefill-migration rules apply only to api_config artifacts."
  - rule_id: AR-MODEL-022
    suppress_on_types: [claude_md, skill, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow]
    reason: "Prefill-migration rules apply only to api_config artifacts."
  - rule_id: AR-MODEL-023
    suppress_on_types: [claude_md, skill, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow]
    reason: "Prefill-migration rules apply only to api_config artifacts."
  - rule_id: AR-MODEL-024
    suppress_on_types: [claude_md, skill, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow]
    reason: "Prefill-migration rules apply only to api_config artifacts."
  - rule_id: AR-MODEL-025
    suppress_on_types: [claude_md, skill, subagent, hook_config, mcp_config, system_prompt, user_prompt, workflow]
    reason: "Prefill-migration rules apply only to api_config artifacts."

# ═══════════════════════════════════════════════════════════════
# Doctrinal-conflict resolution (D-CONFLICT registry)
# ═══════════════════════════════════════════════════════════════
doctrinal_conflicts:
  - id: D-CONFLICT-1
    description: "Emphasis: code.claude.com endorses ALL-CAPS / IMPORTANT (AR-CLAR-015) vs github skill-creator yellow-flags it (AR-CC-S09)"
    resolution: "Type-aware (D9): endorsed for claude_md/system_prompt/user_prompt; yellow-flag for skill/subagent body"
    rules: [AR-CLAR-015, AR-CC-S09]
  - id: D-CONFLICT-2
    description: "Examples count vs body cap: AR-EXAMPLE-004 says 3-5 examples; AR-CC-024 caps SKILL.md body at 500 lines"
    resolution: "Move large example sets to references/examples.md (progressive disclosure pattern from AR-CC-S04/S21)"
    rules: [AR-EXAMPLE-004, AR-CC-024]
  - id: D-CONFLICT-3
    description: "Reference TOC threshold: skill-creator (AR-CC-S10) says >300 lines; agent-skills/best-practices (AR-CC-S21) says >100 lines"
    resolution: "Use the more conservative, more current threshold (>100). AR-CC-S10 is downgraded to historical; AR-CC-S21 is canonical."
    rules: [AR-CC-S10, AR-CC-S21]
