# Rubric by Artifact Type
# Maps each artifact type → applicable rule IDs from rules-anthropic.yaml
# Applying a rule outside its applicable set is a false positive (anti-pattern AP-9).
# Every id below is verified to exist in rules-anthropic.yaml § rules (189 cited rules).

version: "1.3"
date: "2026-05-02"
source: "rules-anthropic.yaml"
notes: |
  v1.1 referenced aspirational ids (AR-SKILL-*, AR2-CC-*, AR2-SKILL-BLG-*) that
  did not exist in the rules file. v1.2 normalized the rubric to the actual id
  namespace shipped with this skill. v1.3 wires the 22 currency-patch rules
  (AR-CLAR-016/017, AR-REASON-017/018/019, AR-MODEL-013..021e, AR-CC-S12..S24)
  into the right type subsets.

# ═══════════════════════════════════════════════════════════════
# CLAUDE.md — Memory file
# ═══════════════════════════════════════════════════════════════
claude_md:
  description: "Memory file at ~/.claude/CLAUDE.md, ./CLAUDE.md, ./.claude/CLAUDE.md, or ./CLAUDE.local.md"
  size_target: 200  # lines, per AR-CC-002
  emphasis_verdict: ENDORSED  # IMPORTANT/YOU MUST allowed (AR-CLAR-015)
  primary_rules:
    # Memory doctrine
    - AR-CC-001  # location canonical
    - AR-CC-002  # ≤200 lines target
    - AR-CC-003  # facts not procedures
    - AR-CC-004  # specific and verifiable
    - AR-CC-005  # @import 5-hop max
    - AR-CC-006  # is user message, not system prompt
    - AR-CC-007  # conflicts cause arbitrary picking
    - AR-CC-008  # HTML comments stripped
    # Clarity (general)
    - AR-CLAR-001
    - AR-CLAR-002
    - AR-CLAR-003
    - AR-CLAR-004
    - AR-CLAR-005
    - AR-CLAR-006  # tell what to DO
    - AR-CLAR-007
    - AR-CLAR-008
    - AR-CLAR-009
    - AR-CLAR-010
    - AR-CLAR-011
    - AR-CLAR-012
    - AR-CLAR-013
    - AR-CLAR-014
    - AR-CLAR-015  # emphasis ENDORSED
    - AR-CONTEXT-013  # bloated CLAUDE.md → ignored
  suppress_findings:
    - AR-CC-S09  # yellow-flag ALL-CAPS — false positive on CLAUDE.md per D9

# ═══════════════════════════════════════════════════════════════
# SKILL — SKILL.md in skills/<name>/
# ═══════════════════════════════════════════════════════════════
skill:
  description: "Skill at ~/.claude/skills/<name>/SKILL.md or .claude/skills/<name>/SKILL.md"
  size_target: 500  # body lines (header + content, excluding frontmatter)
  emphasis_verdict: YELLOW_FLAG  # avoid ALL-CAPS, prefer explaining WHY (AR-CC-S09)
  primary_rules:
    # Skill authoring (canonical, v1.1)
    - AR-CC-S01  # name + description constraints
    - AR-CC-S02  # third-person description (HARD)
    - AR-CC-S03  # description = WHAT + WHEN
    - AR-CC-S04  # references one level deep
    - AR-CC-S05  # be concise — Claude is smart
    - AR-CC-S06  # forward slashes only (HARD)
    - AR-CC-S07  # build evals BEFORE extensive docs (superseded by AR-CC-S23 in v1.2)
    - AR-CC-S08  # pushy descriptions to combat undertriggering
    - AR-CC-S09  # yellow-flag ALL-CAPS in skill body
    - AR-CC-S10  # >300 lines refs need TOC (legacy — AR-CC-S21 now canonical)
    - AR-CC-S11  # imperative form
    # Skill authoring (v1.2 currency patch — agent-skills/best-practices)
    - AR-CC-S12  # test with Haiku/Sonnet/Opus
    - AR-CC-S13  # gerund-form name preferred
    - AR-CC-S14  # no reserved words anthropic/claude (HARD)
    - AR-CC-S15  # avoid time-sensitive language
    - AR-CC-S16  # consistent terminology
    - AR-CC-S17  # solve don't punt (HARD on scripts)
    - AR-CC-S18  # no voodoo constants
    - AR-CC-S19  # MCP tools fully-qualified ServerName:tool (HARD)
    - AR-CC-S20  # declare package dependencies (HARD)
    - AR-CC-S21  # >100 lines refs need TOC (canonical, supersedes AR-CC-S10)
    - AR-CC-S22  # execution intent explicit (Run vs See)
    - AR-CC-S23  # eval-driven development 5-step (canonicalizes AR-CC-S07)
    - AR-CC-S24  # Claude A authors / Claude B tests pattern
    # Claude Code-specific
    - AR-CC-022  # name regex
    - AR-CC-023  # description char budget
    - AR-CC-024  # body ≤500 lines
    - AR-CC-025  # frontmatter spec
    - AR-CC-SAFE-1  # safety: no surprise/malicious content
    # Clarity (general, applicable in body)
    - AR-CLAR-006  # tell what to DO
    - AR-CLAR-007  # match prompt style to output style

# ═══════════════════════════════════════════════════════════════
# SLASH COMMAND — legacy .claude/commands/<name>.md
# ═══════════════════════════════════════════════════════════════
slash_command:
  description: "Legacy slash command at .claude/commands/<name>.md (merged into Skills doctrine)"
  emphasis_verdict: YELLOW_FLAG
  recommendation: "Migrate to .claude/skills/<name>/SKILL.md format for forward compatibility"
  primary_rules:
    - AR-CC-021  # frontmatter must match Skills spec
    - AR-CC-022  # name regex
    - AR-CC-023  # description char budget
    - AR-CC-S02  # third-person description
    - AR-CC-S03  # WHAT + WHEN
    - AR-CC-S06  # forward slashes
    - AR-CC-S11  # imperative form

# ═══════════════════════════════════════════════════════════════
# SUBAGENT — .claude/agents/<name>.md
# ═══════════════════════════════════════════════════════════════
subagent:
  description: "Subagent at .claude/agents/<name>.md or ~/.claude/agents/<name>.md"
  emphasis_verdict: YELLOW_FLAG
  body_doctrine: "Self-contained — receives only body as system prompt, no Claude Code defaults"
  primary_rules:
    - AR-CC-040  # location canonical
    - AR-CC-041  # required: name + description
    - AR-CC-042  # body is system prompt — must be self-contained (HARD)
    - AR-CC-043  # CANNOT spawn other subagents (CRITICAL)
    - AR-CC-044  # description = routing signal, "use proactively"
    - AR-CC-046  # tools allowlist + disallowedTools precedence
    - AR-CC-047  # plugin subagents IGNORE hooks/mcpServers/permissionMode
    # Agent loop rules
    - AR-AGENT-001  # stop conditions
    - AR-AGENT-002  # ground truth
    - AR-AGENT-005  # objective + format + tools + boundaries
    # Clarity in body
    - AR-CLAR-001
    - AR-CLAR-006

# ═══════════════════════════════════════════════════════════════
# HOOK — settings.json hooks key
# ═══════════════════════════════════════════════════════════════
hook_config:
  description: "Hook configuration in .claude/settings.json or ~/.claude/settings.json hooks key"
  primary_rules:
    - AR-CC-061  # 26 canonical events
    - AR-CC-062  # exit code 2 = blocking; 1 = NON-blocking (anti-Unix)
    - AR-CC-063  # PreToolUse precedence: deny > defer > ask > allow
    - AR-CC-064  # default timeout 600s
    - AR-CC-065  # use $CLAUDE_PROJECT_DIR, never relative paths
    - AR-CC-066  # hooks deterministic, CLAUDE.md advisory

# ═══════════════════════════════════════════════════════════════
# MCP — .mcp.json / .claude.json
# ═══════════════════════════════════════════════════════════════
mcp_config:
  description: "MCP server configuration in .mcp.json (project) or ~/.claude.json (user)"
  primary_rules:
    - AR-CC-080  # scope precedence
    - AR-CC-082  # HTTP > SSE (deprecated)
    - AR-CC-083  # env var expansion ${VAR} or ${VAR:-default}
    - AR-CC-084  # third-party = injection risk (CRITICAL)

