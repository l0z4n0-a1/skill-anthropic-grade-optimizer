# ═══════════════════════════════════════════════════════════════
# API CONFIG — request-level configuration (NEW v1.3)
# Detected when artifact contains api_id, model="claude-...", thinking={...},
# effort=..., max_tokens=..., or messages=[...].
# ═══════════════════════════════════════════════════════════════
api_config:
  description: "API call payload (model, thinking, effort, sampling, prefill, tools)"
  primary_rules:
    # Reasoning / thinking
    - AR-REASON-010  # raise effort > prompt around shallow reasoning
    - AR-REASON-011  # adaptive thinking recommended
    - AR-REASON-012  # tool_choice auto/none with thinking
    - AR-REASON-013  # pass thinking blocks back unmodified
    - AR-REASON-014  # plan thinking strategy at turn start
    - AR-REASON-017  # Opus 4.7 effort strict (NEW v1.2 — HARD)
    - AR-REASON-018  # xhigh for coding/agentic on 4.7
    # Model
    - AR-MODEL-001   # self-knowledge prompt
    - AR-MODEL-002   # prefill 4.6+ → 400 (HARD)
    - AR-MODEL-003   # xhigh for coding/agentic
    - AR-MODEL-004   # max_tokens >=64k at max/xhigh
    - AR-MODEL-020   # computer-use 1080p balance (NEW v1.2)
    - AR-MODEL-021  # prefill migration: structured outputs (NEW v1.2)
    - AR-MODEL-022  # prefill migration: direct instruction (NEW v1.2)
    - AR-MODEL-023  # prefill migration: claude handles refusals (NEW v1.2)
    - AR-MODEL-024  # prefill migration: continuation as user message (NEW v1.2)
    - AR-MODEL-025  # prefill migration: context hydration via tools (NEW v1.2)
    # Context / caching
    - AR-CONTEXT-006 # static content at beginning (cache)
    - AR-CONTEXT-007 # cache hierarchy tools→system→messages
    # Tool use
    - AR-TOOL-007    # tool_choice incompatible with extended thinking
    - AR-TOOL-008    # additionalProperties:false on strict objects
    - AR-TOOL-009    # max 20 strict tools
    - AR-TOOL-010    # tool_results in single user message
    - AR-TOOL-011    # tool_result blocks first, text after
    # Vision
    - AR-VISION-001  # images BEFORE text
    - AR-VISION-003  # token cost ≈ w*h/750
    - AR-VISION-004  # native max 2576px
    - AR-VISION-006  # 5MB API / 10MB claude.ai
    - AR-VISION-008  # PDFs before text

