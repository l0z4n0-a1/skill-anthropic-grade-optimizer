rules:
# ═══════════════════════════════════════════════════════════════
# D-CLAR — Clarity & Directness (15 unique rules)
# ═══════════════════════════════════════════════════════════════

- rule_id: AR-CLAR-001
  dimension: D-CLAR
  severity: hard
  statement: "Treat Claude as a brilliant new employee lacking context — explain precisely what you want."
  verbatim_quote: "Think of Claude as a brilliant but new employee who lacks context on your norms and workflows. The more precisely you explain what you want, the better the result."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#be-clear-and-direct"
  detection_method: llm-judge
  applies_to: [system_prompt, user_prompt, claude_md, skill, all]

- rule_id: AR-CLAR-002
  dimension: D-CLAR
  severity: hard
  statement: "Golden rule: if a colleague would be confused by the prompt, Claude will be too."
  verbatim_quote: "Golden rule: Show your prompt to a colleague with minimal context on the task and ask them to follow it. If they'd be confused, Claude will be too."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#be-clear-and-direct"
  detection_method: llm-judge
  applies_to: [all]

- rule_id: AR-CLAR-003
  dimension: D-CLAR
  severity: hard
  statement: "Be specific about desired output format and constraints."
  verbatim_quote: "Be specific about the desired output format and constraints."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#be-clear-and-direct"
  detection_method: heuristic
  applies_to: [all]

- rule_id: AR-CLAR-004
  dimension: D-CLAR
  severity: soft
  statement: "Use numbered/bulleted steps when order or completeness matters."
  verbatim_quote: "Provide instructions as sequential steps using numbered lists or bullet points when the order or completeness of steps matters."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#be-clear-and-direct"
  detection_method: regex
  applies_to: [all]

- rule_id: AR-CLAR-005
  dimension: D-CLAR
  severity: soft
  statement: "Provide WHY behind instructions, not just WHAT."
  verbatim_quote: "Providing context or motivation behind your instructions, such as explaining to Claude why such behavior is important, can help Claude better understand your goals and deliver more targeted responses."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#add-context-to-improve-performance"
  detection_method: llm-judge
  example_violation: "NEVER use ellipses"
  example_correction: "Your response will be read aloud by a text-to-speech engine, so never use ellipses since the engine cannot pronounce them."
  applies_to: [all]

- rule_id: AR-CLAR-006
  dimension: D-CLAR
  severity: hard
  statement: "Tell Claude what to DO instead of what NOT to do — positive instructions outperform negative."
  verbatim_quote: "Tell Claude what to do instead of what not to do."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#control-the-format-of-responses"
  detection_method: regex
  detection_hint: "High frequency of 'do not'/'don't'/'never' without paired positive alternative"
  example_violation: "Do not use markdown in your response"
  example_correction: "Compose your response as smoothly flowing prose paragraphs."
  applies_to: [all]

- rule_id: AR-CLAR-007
  dimension: D-CLAR
  severity: soft
  statement: "Match prompt formatting style to desired output style."
  verbatim_quote: "The formatting style used in your prompt may influence Claude's response style."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#control-the-format-of-responses"
  detection_method: llm-judge
  applies_to: [all]

- rule_id: AR-CLAR-008
  dimension: D-CLAR
  severity: soft
  statement: "Positive examples beat negative instructions for steering output."
  verbatim_quote: "Positive examples showing how Claude can communicate with the appropriate level of concision tend to be more effective than negative examples or instructions that tell the model what not to do."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#response-length-and-verbosity"
  detection_method: llm-judge
  applies_to: [all]
  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  notes: "Same sentence appears verbatim on the dedicated Sonnet 5 page (prompting-claude-sonnet-5#response-length-and-verbosity). Model-specific guidance moved off claude-prompting-best-practices into per-model pages 2026-07."

- rule_id: AR-CLAR-009
  dimension: D-CLAR
  severity: soft
  statement: "On Opus 4.5+, dial back aggressive language ('CRITICAL: You MUST') in tool/skill prompts — causes overtriggering."
  verbatim_quote: "Claude Opus 4.5 and Claude Opus 4.6 are also more responsive to the system prompt than previous models. If your prompts were designed to reduce undertriggering on tools or skills, these models may now overtrigger. The fix is to dial back any aggressive language. Where you might have said 'CRITICAL: You MUST use this tool when...', you can use more normal prompting like 'Use this tool when...'."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#tool-usage"
  detection_method: regex
  detection_hint: "ALL-CAPS imperatives, 'CRITICAL', 'MUST', exclamation overload — but ONLY in skill/subagent contexts (D9 conflict-resolution)"
  applies_to: [skill, subagent, system_prompt]
  model_specific: "opus-4-5, opus-4-6"
  currency: verified-2026-07-11
  notes: "Live page names only Opus 4.5/4.6 for this behavior. On Opus 4.8 / Sonnet 5 the analogous concern is literal instruction following (AR-CLAR-010/012) — aggressive emphasis is followed literally rather than merely overtriggering."

- rule_id: AR-CLAR-010
  dimension: D-CLAR
  severity: hard
  statement: "On Opus 4.8, Sonnet 5, and Opus 4.7, prompts are interpreted literally — state scope explicitly."
  verbatim_quote: "Claude Opus 4.8 interprets prompts literally and explicitly, particularly at lower effort levels. It does not silently generalize an instruction from one item to another, and it does not infer requests you didn't make."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#more-literal-instruction-following"
  detection_method: llm-judge
  applies_to: [all]
  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  notes: "Sonnet 5 page states the identical sentence for Sonnet 5 (prompting-claude-sonnet-5#more-literal-instruction-following). Fable 5 has strong instruction following without the literalism caveat — over-prescriptive prompts degrade its output (see modulation-matrix fable-5.optimal_density)."

- rule_id: AR-CLAR-011
  dimension: D-CLAR
  severity: hard
  statement: "Be explicit when you want action; vague phrasing produces suggestions."
  verbatim_quote: "If you say 'can you suggest some changes,' Claude will sometimes provide suggestions rather than implementing them."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#tool-usage"
  detection_method: regex
  detection_hint: "Phrases like 'can you suggest', 'would you consider' when action is intended"
  applies_to: [user_prompt, system_prompt, slash_command]

- rule_id: AR-CLAR-012
  dimension: D-CLAR
  severity: hard
  statement: "On Opus 4.8, Sonnet 5, and Opus 4.7, state scope explicitly when applying instructions broadly."
  verbatim_quote: "If you need Claude to apply an instruction broadly, state the scope explicitly (for example, 'Apply this formatting to every section, not just the first one')."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#more-literal-instruction-following"
  detection_method: llm-judge
  applies_to: [all]
  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  notes: "Same sentence verbatim on prompting-claude-sonnet-5#more-literal-instruction-following."

- rule_id: AR-CLAR-013
  dimension: D-CLAR
  severity: hard
  statement: "Allow Claude to admit uncertainty — explicit 'I don't know' permission reduces hallucination."
  verbatim_quote: "Allow Claude to say 'I don't know': Explicitly give Claude permission to admit uncertainty. This simple technique can drastically reduce false information."
  source_url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"
  detection_method: regex
  applies_to: [system_prompt, user_prompt, claude_md, agent]

- rule_id: AR-CLAR-014
  dimension: D-CLAR
  severity: soft
  statement: "Restrict to provided documents when grounding matters; forbid general knowledge use."
  verbatim_quote: "External knowledge restriction: Explicitly instruct Claude to only use information from provided documents and not its general knowledge."
  source_url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"
  detection_method: regex
  applies_to: [system_prompt, user_prompt]

- rule_id: AR-CLAR-015
  dimension: D-CLAR
  severity: soft
  statement: "Tune adherence with emphasis tokens (IMPORTANT, YOU MUST) for instruction-style artifacts."
  verbatim_quote: "You can tune instructions by adding emphasis (e.g., 'IMPORTANT' or 'YOU MUST') to improve adherence."
  source_url: "https://code.claude.com/docs/en/best-practices"
  detection_method: regex
  applies_to: [claude_md, system_prompt, user_prompt]
  notes: "Conflicts with AR-CLAR-009 in skill context. Resolution (D9): emphasis OK in instruction-style artifacts; yellow-flag in skill body."

# ═══════════════════════════════════════════════════════════════
# D-STRUCT — Structure & XML (10 unique rules)
# ═══════════════════════════════════════════════════════════════

- rule_id: AR-STRUCT-001
  dimension: D-STRUCT
  severity: soft
  statement: "Use XML tags to structure complex prompts mixing instructions, context, examples, inputs."
  verbatim_quote: "XML tags help Claude parse complex prompts unambiguously, especially when your prompt mixes instructions, context, examples, and variable inputs."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#structure-prompts-with-xml-tags"
  detection_method: regex
  applies_to: [system_prompt, user_prompt, claude_md, skill]

- rule_id: AR-STRUCT-002
  dimension: D-STRUCT
  severity: soft
  statement: "Wrap each content type in its own descriptive tag."
  verbatim_quote: "Wrapping each type of content in its own tag (e.g. <instructions>, <context>, <input>) reduces misinterpretation."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#structure-prompts-with-xml-tags"
  detection_method: regex
  applies_to: [system_prompt, user_prompt]

- rule_id: AR-STRUCT-003
  dimension: D-STRUCT
  severity: soft
  statement: "Use consistent, descriptive tag names across prompts."
  verbatim_quote: "Use consistent, descriptive tag names across your prompts."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#structure-prompts-with-xml-tags"
  detection_method: heuristic
  applies_to: [all]

- rule_id: AR-STRUCT-004
  dimension: D-STRUCT
  severity: soft
  statement: "Nest tags when content has natural hierarchy."
  verbatim_quote: "Nest tags when content has a natural hierarchy."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#structure-prompts-with-xml-tags"
  detection_method: heuristic
  applies_to: [user_prompt, system_prompt]

- rule_id: AR-STRUCT-005
  dimension: D-STRUCT
  severity: soft
  statement: "Wrap multiple documents in <documents> with <document_content> and <source> subtags."
  verbatim_quote: "When using multiple documents, wrap each document in <document> tags with <document_content> and <source> subtags for clarity."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#long-context-prompting"
  detection_method: regex
  applies_to: [user_prompt, system_prompt]

- rule_id: AR-STRUCT-006
  dimension: D-STRUCT
  severity: soft
  statement: "Use XML format indicators to constrain output format."
  verbatim_quote: "Use XML format indicators."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#control-the-format-of-responses"
  detection_method: heuristic
  applies_to: [system_prompt, user_prompt]

- rule_id: AR-STRUCT-007
  dimension: D-STRUCT
  severity: soft
  statement: "Use <thinking> and <answer> tags to separate reasoning from final output."
  verbatim_quote: "Use structured tags like <thinking> and <answer> to cleanly separate reasoning from the final output."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#leverage-thinking"
  detection_method: regex
  applies_to: [system_prompt, user_prompt]

- rule_id: AR-STRUCT-008
  dimension: D-STRUCT
  severity: hard
  statement: "Wrap examples in <example> tags (multiples in <examples>) to distinguish from instructions."
  verbatim_quote: "Wrap examples in <example> tags (multiple examples in <examples> tags) so Claude can distinguish them from instructions."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively"
  detection_method: regex
  detection_hint: "Examples present without <example>/<examples> wrapping"
  applies_to: [all]

- rule_id: AR-STRUCT-009
  dimension: D-STRUCT
  severity: soft
  statement: "Avoid excessive markdown for long-form content; reserve for inline code, code blocks, and simple headings."
  verbatim_quote: "Reserve markdown primarily for inline code, code blocks, and simple headings."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#control-the-format-of-responses"
  detection_method: heuristic
  applies_to: [system_prompt]

- rule_id: AR-STRUCT-010
  dimension: D-STRUCT
  severity: soft
  statement: "Tool format should resemble naturally-occurring text the model has seen during training."
  verbatim_quote: "Keep the format close to what the model has seen naturally occurring in text on the internet."
  source_url: "https://www.anthropic.com/engineering/building-effective-agents"
  detection_method: heuristic
  applies_to: [system_prompt, tool_definition]

# ═══════════════════════════════════════════════════════════════
# D-EXAMPLE — Few-Shot / Multishot (8 unique rules)
# ═══════════════════════════════════════════════════════════════

- rule_id: AR-EXAMPLE-001
  dimension: D-EXAMPLE
  severity: hard
  statement: "Examples are the most reliable way to steer output format, tone, and structure."
  verbatim_quote: "Examples are one of the most reliable ways to steer Claude's output format, tone, and structure."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively"
  detection_method: heuristic
  applies_to: [all]

- rule_id: AR-EXAMPLE-002
  dimension: D-EXAMPLE
  severity: hard
  statement: "Examples must be RELEVANT — mirror the actual use case closely."
  verbatim_quote: "Relevant: Mirror your actual use case closely."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively"
  detection_method: llm-judge
  applies_to: [all]

- rule_id: AR-EXAMPLE-003
  dimension: D-EXAMPLE
  severity: hard
  statement: "Examples must be DIVERSE — cover edge cases and vary so Claude doesn't pick unintended patterns."
  verbatim_quote: "Diverse: Cover edge cases and vary enough that Claude doesn't pick up unintended patterns."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively"
  detection_method: llm-judge
  applies_to: [all]

- rule_id: AR-EXAMPLE-004
  dimension: D-EXAMPLE
  severity: soft
  statement: "Include 3-5 examples for best results."
  verbatim_quote: "Include 3-5 examples for best results."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively"
  detection_method: regex
  detection_hint: "Count <example> tags; warn if 1-2 or >7"
  applies_to: [all]

- rule_id: AR-EXAMPLE-005
  dimension: D-EXAMPLE
  severity: soft
  statement: "Use <thinking> tags inside few-shot examples to demonstrate reasoning patterns."
  verbatim_quote: "Multishot examples work with thinking. Use <thinking> tags inside your few-shot examples to show Claude the reasoning pattern."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#leverage-thinking"
  detection_method: heuristic
  applies_to: [system_prompt, user_prompt]

- rule_id: AR-EXAMPLE-006
  dimension: D-EXAMPLE
  severity: soft
  statement: "Provide concrete input/output pairs for style-sensitive tasks."
  verbatim_quote: "Examples help Claude understand the desired style and level of detail more clearly than descriptions alone."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: llm-judge
  applies_to: [skill, system_prompt]

- rule_id: AR-EXAMPLE-007
  dimension: D-EXAMPLE
  severity: soft
  statement: "Provide concrete examples, not abstract ones."
  verbatim_quote: "Examples are concrete, not abstract."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: llm-judge
  applies_to: [skill, all]

- rule_id: AR-EXAMPLE-008
  dimension: D-EXAMPLE
  severity: soft
  statement: "Avoid offering too many implementation options — provide a default with an escape hatch."
  verbatim_quote: "Don't present multiple approaches unless necessary."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: heuristic
  applies_to: [skill]

