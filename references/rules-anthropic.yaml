  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  notes: "Sonnet 5: propose-options is 'the recommended way to produce meaningfully different design directions across runs' since temperature is not accepted (prompting-claude-sonnet-5#design-and-frontend-defaults)."

- rule_id: AR-MODEL-017
  dimension: D-MODEL
  severity: soft
  statement: "Opus 4.8 needs lighter frontend-design scaffolding than earlier models — overly long anti-AI-slop prompts now overcorrect."
  verbatim_quote: "Claude Opus 4.8 requires less frontend design prompting than previous models to avoid generic patterns that users call the 'AI slop' aesthetic. With earlier models, Anthropic recommended a lengthier prompt snippet... Claude Opus 4.8 generates distinctive, creative frontends with more minimal prompting guidance."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#design-and-frontend-defaults"
  detection_method: llm-judge
  applies_to: [system_prompt, skill]
  domain_signal: ["frontend", "design", "AI slop", "frontend-design"]
  model_specific: "opus-4-8, opus-4-7"
  currency: verified-2026-07-11
  notes: "Sonnet 5 page recommends the same short <frontend_aesthetics> snippet alongside the variety approaches."

- rule_id: AR-MODEL-018
  dimension: D-MODEL
  severity: hard
  statement: "Code-review harness regression on Opus 4.8, Sonnet 5, and Opus 4.7: 'be conservative' / 'only high-severity' instructions reduce recall — use 'report every issue, downstream filter ranks them'."
  verbatim_quote: "When a review prompt says things like 'only report high-severity issues,' 'be conservative,' or 'don't nitpick,' Claude Opus 4.8 may follow that instruction more faithfully than earlier models did: it may investigate the code just as thoroughly, identify the bugs, and then not report findings it judges to be below your stated bar... Report every issue you find, including ones you are uncertain about or consider low-severity. Do not filter for importance or confidence at this stage - a separate verification step will do that."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#code-review-harnesses"
  detection_method: regex
  detection_hint: "Code-review prompt with 'only high-severity'/'be conservative'/'don't nitpick' phrases"
  applies_to: [system_prompt, skill]
  domain_signal: ["code review", "find bugs", "review prompt", "code-review harness", "PR review"]
  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  notes: "High leverage. Canonical snippet at assets/snippets/code-review-coverage.md"

- rule_id: AR-MODEL-019
  dimension: D-MODEL
  severity: soft
  statement: "Opus 4.8 uses more tokens in interactive coding than autonomous; specify task/intent/constraints upfront and minimize required user turns."
  verbatim_quote: "Claude Opus 4.8's token usage and behavior can differ between autonomous, asynchronous coding agents with a single user turn and interactive, synchronous coding agents with multiple user turns. Specifically, it tends to use more tokens in interactive settings, primarily because it reasons more after user turns."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#interactive-coding-products"
  detection_method: llm-judge
  applies_to: [system_prompt, agent]
  model_specific: "opus-4-8, opus-4-7; sonnet-5 (same upfront-specification guidance, without the reasons-more-after-user-turns claim)"
  currency: verified-2026-07-11

- rule_id: AR-MODEL-020
  dimension: D-MODEL
  severity: soft
  statement: "Computer use on Opus 4.8 / Sonnet 5 / Opus 4.7: 1080p balances perf/cost; 720p or 1366×768 for cost-sensitive workloads."
  verbatim_quote: "Internal computer use testing shows that sending images at 1080p provides a good balance of performance and cost. For particularly cost-sensitive workloads, 720p or 1366×768 are lower-cost options with strong performance."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#computer-use"
  detection_method: code-check
  applies_to: [computer_use, api_config]
  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  notes: "Same guidance verbatim on prompting-claude-sonnet-5#computer-use, which also states Sonnet 5 supports the computer_20251124 tool version."

# --- D-MODEL: prefill migration patterns ---
# AR-MODEL-021..025 form a cohesive group covering the 5 canonical migration
# patterns from the prefill-deprecation section. Each is an independent rule
# (numeric IDs preserve schema regex AR-[A-Z]+-\d{3}) but they share parent
# rationale: AR-MODEL-002 (prefill on 4.6+ → 400). When 002 fires, the audit
# emits 021..025 as Open Questions for the operator to choose among.

- rule_id: AR-MODEL-021
  dimension: D-MODEL
  severity: soft
  statement: "Prefill migration pattern (Structured Outputs) — replaces prefilled JSON/YAML schema constraint."
  verbatim_quote: "The Structured Outputs feature is designed specifically to constrain Claude's responses to follow a given schema. Try asking the model to conform to your output structure first, as newer models can reliably match complex schemas when told to, especially if implemented with retries."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#migrating-away-from-prefilled-responses"
  detection_method: code-check
  applies_to: [api_config]
  model_specific: "claude-4-6+ (opus-4-8, sonnet-5, fable-5 included)"
  currency: verified-2026-07-11
  group: prefill-migration

- rule_id: AR-MODEL-022
  dimension: D-MODEL
  severity: soft
  statement: "Prefill migration pattern (Eliminate preambles) — direct system-prompt instruction replaces 'Here is the requested...' prefill."
  verbatim_quote: "Use direct instructions in the system prompt: 'Respond directly without preamble. Do not start with phrases like Here is..., Based on..., etc.'"
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#migrating-away-from-prefilled-responses"
  detection_method: code-check
  applies_to: [api_config]
  model_specific: "claude-4-6+ (opus-4-8, sonnet-5, fable-5 included)"
  currency: verified-2026-07-11
  group: prefill-migration

- rule_id: AR-MODEL-023
  dimension: D-MODEL
  severity: soft
  statement: "Prefill migration pattern (Bad-refusal steering deprecated) — modern Claude handles refusals via direct user-message prompting."
  verbatim_quote: "Claude is much better at appropriate refusals now. Clear prompting within the user message without prefill should be sufficient."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#migrating-away-from-prefilled-responses"
  detection_method: code-check
  applies_to: [api_config]
  model_specific: "claude-4-6+ (opus-4-8, sonnet-5, fable-5 included)"
  currency: verified-2026-07-11
  group: prefill-migration

- rule_id: AR-MODEL-024
  dimension: D-MODEL
  severity: soft
  statement: "Prefill migration pattern (Continuations) — move continuation to user message with interrupted text quoted."
  verbatim_quote: "Move the continuation to the user message, and include the final text from the interrupted response: 'Your previous response was interrupted and ended with [previous_response]. Continue from where you left off.'"
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#migrating-away-from-prefilled-responses"
  detection_method: code-check
  applies_to: [api_config]
  model_specific: "claude-4-6+ (opus-4-8, sonnet-5, fable-5 included)"
  currency: verified-2026-07-11
  group: prefill-migration

- rule_id: AR-MODEL-025
  dimension: D-MODEL
  severity: soft
  statement: "Prefill migration pattern (Context hydration) — inject reminders into user turns or hydrate via tools."
  verbatim_quote: "For very long conversations, inject what were previously prefilled-assistant reminders into the user turn. If context hydration is part of a more complex agentic system, consider hydrating via tools."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#migrating-away-from-prefilled-responses"
  detection_method: code-check
  applies_to: [api_config]
  model_specific: "claude-4-6+ (opus-4-8, sonnet-5, fable-5 included)"
  currency: verified-2026-07-11
  group: prefill-migration

# --- D-CC/D-SKILL additions (skill-authoring refinements from agent-skills/best-practices) ---

- rule_id: AR-CC-S12
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "Test skills with Haiku, Sonnet, and Opus before shipping — effectiveness depends on the underlying model."
  verbatim_quote: "Skills act as additions to models, so effectiveness depends on the underlying model. Test your Skill with all the models you plan to use it with."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: code-check
  detection_hint: "evals/ground-truth.yaml should declare which models the skill targets; if only one declared on a multi-model artifact → finding"
  applies_to: [skill]

- rule_id: AR-CC-S13
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "Prefer gerund form for skill names (processing-pdfs, analyzing-spreadsheets); accept noun-phrase or action-oriented as alternatives."
  verbatim_quote: "Consider using gerund form (verb + -ing) for Skill names, as this clearly describes the activity or capability the Skill provides."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: regex
  detection_hint: "Skill name not ending in '-ing', not starting with verb-prefix (process-, analyze-, generate-), not noun-phrase pattern"
  applies_to: [skill]

- rule_id: AR-CC-S14
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: hard
  statement: "Skill name must not contain reserved words 'anthropic' or 'claude'."
  verbatim_quote: "Cannot contain reserved words: 'anthropic', 'claude'."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: regex
  applies_to: [skill]
  notes: "Isolates the reserved-word check from the composite AR-CC-S01 (frontmatter constraints) for granular detection. Both fire on the same violation; deduplicate at emit time."

- rule_id: AR-CC-S15
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "Avoid time-sensitive language in skills (dated thresholds like 'after August 2025'); use an 'old patterns' section instead."
  verbatim_quote: "Don't include information that will become outdated... Use 'old patterns' section: provides historical context without cluttering the main content."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: regex
  detection_hint: "Date patterns near temporal prepositions: 'before/after [Month YYYY]', 'until YYYY'"
  applies_to: [skill]

- rule_id: AR-CC-S16
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "Use consistent terminology throughout the skill — choose one term and use it always."
  verbatim_quote: "Use consistent terminology. Choose one term and use it throughout the Skill... Consistency helps Claude understand and follow instructions."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: llm-judge
  applies_to: [skill]

- rule_id: AR-CC-S17
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: hard
  statement: "Skill scripts must solve, not punt — handle errors explicitly rather than 'just fail and let Claude figure it out'."
  verbatim_quote: "Solve, don't punt. When writing scripts for Skills, handle error conditions rather than punting to Claude."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: code-check
  detection_hint: "Scripts with bare except: pass, or open() without try/except"
  applies_to: [skill]

- rule_id: AR-CC-S18
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "No voodoo constants in skill scripts — every numeric value justified or self-documenting (Ousterhout's law)."
  verbatim_quote: "Configuration parameters should also be justified and documented to avoid 'voodoo constants' (Ousterhout's law). If you don't know the right value, how will Claude determine it?"
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: regex
  detection_hint: "Numeric literals (TIMEOUT = 47, RETRIES = 5) without adjacent comment"
  applies_to: [skill]

- rule_id: AR-CC-S19
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: hard
  statement: "MCP tool references in skills must use fully-qualified ServerName:tool_name to avoid 'tool not found' errors."
  verbatim_quote: "If your Skill uses MCP (Model Context Protocol) tools, always use fully qualified tool names to avoid 'tool not found' errors. Format: ServerName:tool_name"
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: regex
  detection_hint: "References to MCP tool without 'Server:tool' colon-separated form"
  applies_to: [skill]

- rule_id: AR-CC-S20
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: hard
  statement: "Don't assume packages are installed — declare dependencies explicitly in skill instructions."
  verbatim_quote: "Don't assume packages are available. Bad: 'Use the pdf library to process the file.' Good: 'Install required package: pip install pypdf. Then use it...'"
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: code-check
  applies_to: [skill]

- rule_id: AR-CC-S21
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "Reference files >100 lines should include a table of contents at the top (refines AR-CC-S10 from skill-creator)."
  verbatim_quote: "For reference files longer than 100 lines, include a table of contents at the top. This ensures Claude can see the full scope of available information even when previewing with partial reads."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: code-check
  applies_to: [skill]
  notes: |
    Doctrinal conflict: skill-creator (AR-CC-S10) says >300 lines; agent-skills/best-practices
    says >100 lines. Resolution (D-CONFLICT-3): use the more conservative, more current
    threshold (>100). AR-CC-S10 is downgraded to historical; AR-CC-S21 is canonical.

- rule_id: AR-CC-S22
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "Make execution intent explicit — 'Run X' (execute) vs. 'See X' (read as reference)."
  verbatim_quote: "Make execution intent clear: 'Run analyze_form.py to extract fields' (execute) vs. 'See analyze_form.py for the extraction algorithm' (read as reference)."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: regex
  detection_hint: "References to scripts without 'Run'/'execute' or 'See'/'read' framing"
  applies_to: [skill]

- rule_id: AR-CC-S23
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "Build evaluations FIRST — measure baseline without skill, then write minimal instructions to pass evals (evaluation-driven development)."
  verbatim_quote: "Create evaluations BEFORE writing extensive documentation. This ensures your Skill solves real problems rather than documenting imagined ones."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: code-check
  detection_hint: "Refines AR-CC-S07; canonicalizes the 5-step process: identify gaps → create evals → establish baseline → write minimal instructions → iterate"
  applies_to: [skill]
  notes: "verbatim corrected in E1-fix from synthesized 5-step paraphrase to canonical doc statement. The 5-step process lives in detection_hint, not in the verbatim_quote field."

- rule_id: AR-CC-S24
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
  statement: "Iterate skill development with two Claude instances — Claude A authors, Claude B tests; bring observations back to A."
  verbatim_quote: "Work with one instance of Claude ('Claude A') to create a Skill that is used by other instances ('Claude B'). Claude A helps you design and refine instructions, while Claude B tests them in real tasks."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: llm-judge
  applies_to: [skill]
  notes: "Process rule (not artifact-detection); used in audit reports as recommendation"

