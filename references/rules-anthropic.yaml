# --- D-CLAR additions (Opus 4.7 verbosity + tone) ---

- rule_id: AR-CLAR-016
  dimension: D-CLAR
  severity: soft
  statement: "On Opus 4.8, Sonnet 5, and Opus 4.7, response length is task-calibrated; tune prompts when product needs fixed verbosity."
  verbatim_quote: "Claude Opus 4.8 calibrates response length to how complex it judges the task to be, rather than defaulting to a fixed verbosity. This usually means shorter answers on simple lookups and much longer ones on open-ended analysis."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#response-length-and-verbosity"
  detection_method: llm-judge
  applies_to: [system_prompt, user_prompt]
  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  notes: "Canonical fix snippet stored at assets/snippets/concise-output.md"

- rule_id: AR-CLAR-017
  dimension: D-CLAR
  severity: soft
  statement: "Opus 4.8 prose is direct, opinionated, minimal validation-forward phrasing, sparing emoji — re-evaluate voice prompts on migration."
  verbatim_quote: "Claude Opus 4.8 tends toward a direct, opinionated style with minimal validation-forward phrasing and sparing emoji use. If your product relies on a specific voice, re-evaluate style prompts against the new baseline."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#tone-and-writing-style"
  detection_method: llm-judge
  applies_to: [system_prompt]
  model_specific: "opus-4-8, opus-4-7"
  currency: verified-2026-07-11
  notes: "Sonnet 5 page keeps only the generic 'prose style may shift — re-evaluate style prompts' advice, without a directional claim."

# --- D-REASON additions (effort semantics + adaptive steerability) ---

- rule_id: AR-REASON-017
  dimension: D-REASON
  severity: soft
  severity_amplification:
    when: "target_model in [opus-4-8, sonnet-5, opus-4-7] AND workload_signal includes coding|agentic"
    to: hard
  statement: "On Opus 4.8, Sonnet 5, and Opus 4.7, effort levels are strict — low/medium scope tighter and risk under-thinking on moderately complex tasks."
  verbatim_quote: "Claude Opus 4.8 respects effort levels strictly, especially at the low end. At `low` and `medium`, the model scopes its work to what was asked rather than going above and beyond. This is good for latency and cost, but on moderately complex tasks running at `low` effort there is some risk of under-thinking."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#calibrating-effort-and-thinking-depth"
  detection_method: code-check
  detection_hint: "If api_config.effort in ['low','medium'] and artifact requests multi-step coding/agentic work → flag"
  applies_to: [api_config]
  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  notes: "Doc says 'some risk of under-thinking' (probabilistic, not breaker). Same sentence for Sonnet 5 on its page; Sonnet 5 cross-model mapping: 'Claude Sonnet 5 at medium is comparable in intelligence to Claude Sonnet 4.6 at high, and Claude Sonnet 5 at high is comparable to Claude Sonnet 4.6 at max.'"
  notes: "Doc says 'some risk of under-thinking' (probabilistic, not breaker). Severity soft by default; amplified to hard when coding/agentic workload signal present (zero-tolerance addition gated on context)."

- rule_id: AR-REASON-018
  dimension: D-REASON
  severity: soft
  statement: "On Opus 4.8/4.7, start with xhigh effort for coding/agentic; minimum high for intelligence-sensitive. Sonnet 5: high default, xhigh only for hardest coding/agentic. NOT applicable to Fable 5 (start high)."
  verbatim_quote: "Start with the `xhigh` effort level for coding and agentic use cases, and use a minimum of `high` effort for most intelligence-sensitive use cases."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#calibrating-effort-and-thinking-depth"
  detection_method: code-check
  applies_to: [api_config]
  model_specific: "opus-4-8, opus-4-7; sonnet-5 variant; NOT fable-5"
  currency: verified-2026-07-11
  notes: "Distinct from AR-MODEL-003 (which only states the recommendation); AR-REASON-018 is the detection rule. Detection must branch by target model: flagging effort<xhigh on a fable-5 coding config is a FALSE POSITIVE (fable-5.effort_recommended: high for most tasks)."

- rule_id: AR-REASON-019
  dimension: D-REASON
  severity: soft
  statement: "Adaptive-thinking triggering is steerable; add prompt guidance when model thinks more than desired."
  verbatim_quote: "The triggering behavior for adaptive thinking is steerable. If you find the model thinking more often than you'd like, which can happen with large or complex system prompts, add guidance to steer it. As always, measure the effect of any prompting changes on performance."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#calibrating-effort-and-thinking-depth"
  detection_method: hybrid   # regex detects presence of steering snippet; LLM grades adequacy
  detection_hint: "Pass-1 regex looks for 'thinking'/'adaptive' + steering verbs ('respond directly'/'when in doubt'/'only when'). Pass-2 grades whether steering matches workload."
  applies_to: [system_prompt]
  model_specific: "opus-4-8, sonnet-5, opus-4-7, opus-4-6, sonnet-4-6"
  currency: verified-2026-07-11
  notes: "Canonical snippet at assets/snippets/steer-thinking.md. Sonnet 5 wording: 'If you find the model emitting thinking blocks more often than you'd like' — relevant there because adaptive thinking is ON by default."
  notes: "Canonical snippet at assets/snippets/steer-thinking.md. detection_method changed to hybrid in E1-fix — pure regex cannot detect 'absence of adequate steering'."

# --- D-MODEL additions (Opus 4.7 behavioral shifts + code-review + frontend + interactive coding) ---

- rule_id: AR-MODEL-013
  dimension: D-MODEL
  severity: soft
  statement: "On Opus 4.8/4.7, tool usage decreases by default — raise effort or prompt explicitly when more tool use is wanted. INVERTED on Sonnet 5 (more agentic than 4.6 by default) except with thinking disabled, where it under-reaches for tools."
  verbatim_quote: "Claude Opus 4.8 has a tendency to favor reasoning over tool calls. This produces better results in most cases. However, increasing the effort setting is a useful lever to increase the level of tool usage, especially in knowledge work."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#tool-use-triggering"
  detection_method: llm-judge
  applies_to: [system_prompt, agent]
  model_specific: "opus-4-8, opus-4-7; INVERTED on sonnet-5 (thinking-off is the exception)"
  currency: verified-2026-07-11
  notes: "Sonnet 5 divergence (prompting-claude-sonnet-5#tool-use-triggering): 'Claude Sonnet 5 is more agentic than Claude Sonnet 4.6 by default and will reach for tools and run self-verification loops more readily. With thinking disabled, the model is less likely to reach for tools or consider searching; if you rely on tool calls with thinking off, add an explicit nudge in the system prompt.' Candidate for a dedicated sonnet-5 rule in the next dissection (would change meta.total_unique_rules)."

- rule_id: AR-MODEL-014
  dimension: D-MODEL
  severity: soft
  statement: "Remove legacy 'after N tool calls, summarize' scaffolding — Opus 4.8, Sonnet 5, and Opus 4.7 emit higher-quality progress updates by default."
  verbatim_quote: "Claude Opus 4.8 provides more regular, higher-quality updates to the user throughout long agentic traces. If you've added scaffolding to force interim status messages ('After every 3 tool calls, summarize progress'), try removing it."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#user-facing-progress-updates"
  detection_method: regex
  detection_hint: "Phrases like 'after every N tool', 'summarize every', 'every N actions provide a status'"
  applies_to: [system_prompt, agent, claude_md]
  model_specific: "opus-4-8, sonnet-5, opus-4-7"
  currency: verified-2026-07-11
  applicability: extrapolated  # doc context is API harness; claude_md inclusion is reasonable extrapolation per gaps.md G4

- rule_id: AR-MODEL-015
  dimension: D-MODEL
  severity: soft
  statement: "Subagent spawning is steerable on Opus 4.8/4.7 (fewer by default) — provide explicit guidance about when subagents are desirable. Reversed on Fable 5: delegates readily, guidance should govern rather than encourage."
  verbatim_quote: "Claude Opus 4.8 tends to spawn fewer subagents by default. However, this behavior is steerable through prompting; give Claude Opus 4.8 explicit guidance around when subagents are desirable."
  source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-4-8#controlling-subagent-spawning"
