  source_url: "https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md"
  detection_method: regex
  applies_to: [skill]
  notes: "D9 conflict: emphasis IS endorsed for CLAUDE.md/system_prompt (AR-CLAR-015). Yellow-flag applies ONLY to skill/subagent body."

- rule_id: AR-CC-S10
  dimension: D-CC
