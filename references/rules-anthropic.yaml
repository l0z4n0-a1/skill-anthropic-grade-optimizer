  detection_method: llm-judge
  applies_to: [skill, claude_md]

- rule_id: AR-CC-S06
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: hard
  statement: "Use forward slashes in file paths — never Windows-style backslashes."
  verbatim_quote: "Always use forward slashes in file paths, even on Windows."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: regex
  applies_to: [skill, claude_md]

- rule_id: AR-CC-S07
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: hard
  statement: "Build evaluations BEFORE writing extensive skill documentation."
  verbatim_quote: "Create evaluations BEFORE writing extensive documentation. This ensures your Skill solves real problems rather than documenting imagined ones."
  source_url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
  detection_method: code-check
  applies_to: [skill]

- rule_id: AR-CC-S08
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: hard
  statement: "Description MUST encode triggering contexts; be slightly pushy beyond 'what it does'."
  verbatim_quote: "Claude has a tendency to 'undertrigger' skills... please make the skill descriptions a little bit 'pushy'."
  source_url: "https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md"
  detection_method: llm-judge
  applies_to: [skill]

- rule_id: AR-CC-S09
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: soft
