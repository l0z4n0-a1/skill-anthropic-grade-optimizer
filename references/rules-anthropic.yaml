  applies_to: [system_prompt, agent, claude_md]
  model_specific: "opus-4-8, opus-4-7; REVERSED on fable-5"
  currency: verified-2026-07-11
  notes: "Canonical snippet at assets/snippets/subagent-spawning-4-7.md"

- rule_id: AR-MODEL-016
  dimension: D-MODEL
  severity: soft
  statement: "On Opus 4.8 (cream + serif + terracotta house style) and Sonnet 5, design defaults persist; generic negation bounces — specify concrete alternative or ask model to propose options."
  verbatim_quote: "This default is persistent. Generic instructions ('don't use cream,' 'make it clean and minimal') tend to shift the model to a different fixed palette rather than producing variety. Two approaches work reliably: 1. Specify a concrete alternative... 2. Have the model propose options before building."
