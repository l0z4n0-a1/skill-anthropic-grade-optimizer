  applies_to: [system_prompt, claude_md, agent]

# ═══════════════════════════════════════════════════════════════
# D-AGENT — Agent Loop & Multi-Agent (9 unique rules)
# ═══════════════════════════════════════════════════════════════

- rule_id: AR-AGENT-001
  dimension: D-AGENT
  severity: hard
