  detection_method: code-check
  applies_to: [workflow, agent]

- rule_id: AR-AGENT-003
  dimension: D-AGENT
  severity: hard
  statement: "Prefer workflows over agents when steps are predictable."
  verbatim_quote: "Workflows offer predictability and consistency for well-defined tasks, whereas agents are the better option when flexibility and model-driven decision-making are needed."
