  verbatim_quote: "For large reference files (>300 lines), include a table of contents."
  source_url: "https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md"
  detection_method: code-check
  applies_to: [skill]

- rule_id: AR-CC-S11
  dimension: D-CC
  sub_dimension: D-SKILL
