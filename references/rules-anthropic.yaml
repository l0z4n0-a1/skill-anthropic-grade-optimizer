# --- D-SKILL (skill authoring philosophy) ---

- rule_id: AR-CC-S01
  dimension: D-CC
  sub_dimension: D-SKILL
  severity: hard
  statement: "Skill name + description constraints (regex name, ≤1024 char description, no XML tags, no reserved words)."
  verbatim_quote: "name: Maximum 64 characters... description: Must be non-empty, Maximum 1024 characters, Cannot contain XML tags."
