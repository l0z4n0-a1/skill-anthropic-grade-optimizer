# Canonical Snippets Index
# Maps rule_id → snippet path. Consulted by optimize.py to propose verbatim
# patches instead of generating paraphrased text.
#
# Each snippet at assets/snippets/<name>.md carries a header table with:
#   triggers_rule, applies_to, model_specific, verbatim (yes/no),
#   source_url, insertion_pattern, voice_drift.
#
# All 16 snippets are byte-by-byte verbatim from the live Anthropic doc.
# Validation: scripts/validate_snippets.py (added in E3) re-fetches and asserts.

version: "1.0"
date: "2026-05-02"
total_snippets: 18    # 16 rule-bound + 2 advisory (latex-opt-out, cleanup-temp-files)
verbatim_compliance: 100  # % of snippets carrying byte-exact doc text
source_doc: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"

# Primary mapping: rule_id → list of applicable snippets
# (some rules have multiple snippets — e.g., AR-CLAR-011 has both
# default-to-action and do-not-act-before-instructions, picked by posture)
snippets_by_rule:

  AR-CLAR-011:
    - default-to-action.md          # action-by-default posture
    - do-not-act-before-instructions.md  # research-first posture

  AR-CLAR-016:
    - concise-output.md

  AR-STRUCT-009:
    - avoid-excessive-markdown.md

  AR-REASON-009:
    - pick-and-commit.md

  AR-REASON-019:
    - steer-thinking.md

  AR-CONTEXT-009:
    - multi-window-context.md

  AR-MODEL-001:
    - model-self-knowledge.md

  AR-MODEL-006:
    - frontend-aesthetics.md

  AR-MODEL-007:
    - use-parallel-tool-calls.md

  AR-MODEL-009:
    - reversibility-safety.md

  AR-MODEL-010:
    - avoid-overengineering.md

  AR-MODEL-011:
    - investigate-before-answering.md

  AR-MODEL-012:
    - general-purpose-solution.md

  AR-MODEL-015:
    - subagent-spawning-4-7.md

  AR-MODEL-016:
    - frontend-aesthetics.md  # shared with AR-MODEL-006

  AR-MODEL-017:
    - frontend-aesthetics.md  # shared (4.7 lighter calibration)

  AR-MODEL-018:
    - code-review-coverage.md

  AR-AGENT-009:
    - use-parallel-tool-calls.md  # shared with AR-MODEL-007

  # No-rule advisory snippets (no rule_id but useful)
  no_rule_advisory:
    - latex-opt-out.md          # use when output context can't render LaTeX
    - cleanup-temp-files.md     # use when scratch files should not persist

# Inverse mapping: snippet → rules it can fix
rules_by_snippet:
  default-to-action.md: [AR-CLAR-011]
  do-not-act-before-instructions.md: [AR-CLAR-011]
  concise-output.md: [AR-CLAR-016]
  avoid-excessive-markdown.md: [AR-STRUCT-009]
  pick-and-commit.md: [AR-REASON-009]
  steer-thinking.md: [AR-REASON-019]
  multi-window-context.md: [AR-CONTEXT-009]
  model-self-knowledge.md: [AR-MODEL-001]
  frontend-aesthetics.md: [AR-MODEL-006, AR-MODEL-016, AR-MODEL-017]
  use-parallel-tool-calls.md: [AR-MODEL-007, AR-AGENT-009]
  reversibility-safety.md: [AR-MODEL-009]
  avoid-overengineering.md: [AR-MODEL-010]
  investigate-before-answering.md: [AR-MODEL-011]
  general-purpose-solution.md: [AR-MODEL-012]
  subagent-spawning-4-7.md: [AR-MODEL-015]
  code-review-coverage.md: [AR-MODEL-018]
  latex-opt-out.md: []   # advisory
  cleanup-temp-files.md: []  # advisory

# Type-aware suppression (AP-9 prevention)
# A snippet should NOT be inserted into these artifact types even when its
# triggering rule fires (because the snippet is a system-prompt-style block).
suppress_in_types:
  default-to-action.md: [skill, subagent, hook_config, mcp_config]
  do-not-act-before-instructions.md: [skill, subagent, hook_config, mcp_config]
  use-parallel-tool-calls.md: [skill, hook_config, mcp_config]
  investigate-before-answering.md: [skill, hook_config, mcp_config]  # in skill body, paraphrase per AR-CC-S09
  subagent-spawning-4-7.md: [subagent]  # AP-9 — subagents can't spawn subagents
  code-review-coverage.md: [hook_config, mcp_config, subagent]
  frontend-aesthetics.md: [hook_config, mcp_config, claude_md]
  avoid-excessive-markdown.md: [skill, subagent, hook_config, mcp_config]
  reversibility-safety.md: [hook_config, mcp_config]
  pick-and-commit.md: [hook_config, mcp_config]
  steer-thinking.md: [skill, subagent, hook_config, mcp_config, claude_md]  # api-payload concept
  multi-window-context.md: [skill, hook_config, mcp_config]
  avoid-overengineering.md: [hook_config, mcp_config]
  general-purpose-solution.md: [hook_config, mcp_config]
  model-self-knowledge.md: [skill, subagent, hook_config, mcp_config, claude_md]
  concise-output.md: [hook_config, mcp_config]
  latex-opt-out.md: [skill, subagent, hook_config, mcp_config, claude_md]
  cleanup-temp-files.md: [hook_config, mcp_config]

# Voice-drift estimate per snippet (used by optimize.py voice gate)
# All snippets are doc-canonical so drift is "low" by default. Operator can
# override via voice-fingerprint.yaml.
voice_drift_default: low
